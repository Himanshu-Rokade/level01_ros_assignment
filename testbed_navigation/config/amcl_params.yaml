amcl:
  ros__parameters:
    use_sim_time: true

    # Frames and topics
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: scan
    map_topic: map
    tf_broadcast: true
    transform_tolerance: 1.0

    # Motion model for a differential drive robot
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # Particle filter
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    kld_err: 0.05
    kld_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    update_min_d: 0.1
    update_min_a: 0.1

    # Laser model
    laser_model_type: "likelihood_field"
    laser_min_range: 0.1
    laser_max_range: 10.0
    max_beams: 60
    laser_likelihood_max_dist: 2.0
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    sigma_hit: 0.2
    lambda_short: 0.1

    # Initial pose (robot's spawn position)
    set_initial_pose: true
    always_reset_initial_pose: false
    initial_pose:
      x: 0.0
      y: 5.0
      z: 0.0
      yaw: 0.0

    save_pose_rate: 0.5
    first_map_only: false